[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "xnotebook"
dynamic = ["version"]
description = "Run notebooks and scripts on sandboxed xeus wasm kernels (emscripten-forge) inside headless Chromium"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
dependencies = [
    "typer>=0.12",
    "typing_extensions>=4.6",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Jupyter",
    "Topic :: Security",
]

[project.optional-dependencies]
test = ["pytest>=7", "nbformat>=5", "jsonschema>=4"]

[project.scripts]
xnb = "xnotebook.cli:main"
xnotebook = "xnotebook.cli:main"

[tool.hatch.version]
path = "xnotebook/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["xnotebook"]
artifacts = ["xnotebook/_web/**"]

[tool.hatch.build.targets.sdist]
include = ["xnotebook", "web/src", "web/build.mjs", "web/package.json", "web/package-lock.json", "web/tsconfig.json", "hatch_build.py", "tests", "README.md", "PLAN.md"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
